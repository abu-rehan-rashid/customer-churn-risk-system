name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-train-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest ruff httpx

      - name: Lint codebase with Ruff
        run: ruff check src/ tests/ app.py ui_app.py benchmark_api.py --ignore E501

      - name: Train model & run real-model pytest suite
        run: |
          python src/train.py
          pytest -v

      - name: Build and smoke-test Docker image
        run: |
          docker build -t churn-risk-api:ci .
          docker run -d --name churn-smoke -p 8000:8000 churn-risk-api:ci
          sleep 5
          curl -f http://127.0.0.1:8000/health
          docker rm -f churn-smoke
