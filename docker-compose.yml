services:
  api:
    build: .
    container_name: churn-risk-api
    ports:
      - "8000:8000"
    environment:
      - PREDICTIONS_DB_PATH=/app/logs/predictions.db
    volumes:
      - churn_logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  ui:
    build: .
    container_name: churn-risk-ui
    command: ["streamlit", "run", "ui_app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    ports:
      - "8501:8501"
    environment:
      - PREDICTIONS_DB_PATH=/app/logs/predictions.db
    volumes:
      - churn_logs:/app/logs
    depends_on:
      api:
        condition: service_healthy

volumes:
  churn_logs: